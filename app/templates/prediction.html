<div class="result-card">

    <h2>Prediction Result</h2>

    <div class="result-item">
        <span>Sentiment:</span>
        <strong>{{ result.sentiment }}</strong>
    </div>


    <div class="result-item">
        <span>Reason:</span>

        {% if result.reason %}
            <strong>{{ result.reason }}</strong>
        {% else %}
            <strong>No issue detected</strong>
        {% endif %}
    </div>

</div>
